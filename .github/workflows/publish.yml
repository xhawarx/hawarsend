# ─── Publish ─────────────────────────────────────────────────
# Builds the HawarSend image for amd64 and arm64 on native runners, checks that it boots,
# and pushes it to ghcr.io/<owner>/hawarsend.
#
# Tags:
#   push to main          latest, sha-<short>
#   push to hawarsend-v2  edge, sha-<short>
#   tag vX.Y.Z            X.Y.Z, X.Y, X, latest

name: Publish

on:
  push:
    branches:
      - main
      - hawarsend-v2
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hawarsend" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.suffix }})
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          pull: true
          push: true
          tags: ${{ env.IMAGE }}:build-${{ github.sha }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.title=HawarSend
            org.opencontainers.image.description=End-to-end encrypted, self-hostable file and note sharing
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=hs-${{ matrix.suffix }}
          cache-to: type=gha,scope=hs-${{ matrix.suffix }},mode=max

      - name: Smoke test
        if: matrix.suffix == 'amd64'
        run: |
          docker run -d --name smoke -p 3000:3000 -e BASE_URL=http://localhost:3000 \
            "$IMAGE:build-${{ github.sha }}-amd64"
          for i in $(seq 1 45); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "Healthy after ${i}s"
              # The admin API stays off without ADMIN_PASSWORD.
              test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/admin/session)" = "404"
              docker rm -f smoke
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1

  manifest:
    name: Manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hawarsend" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch tags
        run: |
          SRC="$IMAGE:build-${GITHUB_SHA}"
          TAGS=("sha-${GITHUB_SHA::7}")
          case "$GITHUB_REF" in
            refs/heads/main) TAGS+=("latest") ;;
            refs/heads/hawarsend-v2) TAGS+=("edge") ;;
            refs/tags/v*)
              V="${GITHUB_REF_NAME#v}"
              TAGS+=("$V" "${V%.*}" "${V%%.*}" "latest") ;;
          esac
          for T in "${TAGS[@]}"; do
            docker buildx imagetools create -t "$IMAGE:$T" "$SRC-amd64" "$SRC-arm64"
            echo "Pushed $IMAGE:$T"
          done
