# HawarSend, built from this repository's Dockerfile.
# Coolify fills SERVICE_URL_SKYSEND with the public URL of the service and ADMIN_PASSWORD from
# its environment variables. The service keeps the name "skysend" so the domain stays mapped.
services:
  skysend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    expose:
      - "3000"
    volumes:
      - ./data:/data
      - ./uploads:/uploads
    environment:
      - BASE_URL=${SERVICE_URL_SKYSEND:-http://localhost:3000}
      - TRUST_PROXY=true
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # All environment variables: docs/user-guide/configuration/environment-variables.md
